<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="줍줍">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>줍줍 무료 보상 모음</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#16181d;--sub:#6b7280;--line:#e6e8ec;
  --accent:#2f6bff;--accent-soft:#e8efff;--good:#12a150;--good-soft:#e5f6ec;
  --warn:#d97706;--warn-soft:#fdf1e1;--bad:#dc2626;--bad-soft:#fdeaea;
  --new:#e11d74;--radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--card:#1a1d24;--text:#f1f3f6;--sub:#9aa1ad;--line:#2a2e37;
  --accent:#6e98ff;--accent-soft:#1f2a45;--good:#3ccf7d;--good-soft:#173326;
  --warn:#f5a524;--warn-soft:#3a2b12;--bad:#f87171;--bad-soft:#3b1b1b;--new:#f472b6;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}
header p{margin:0;color:var(--sub);font-size:13px}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.refresh{flex:none;border:none;background:var(--card);color:var(--text);border-radius:99px;padding:8px 12px;
  font-weight:700;font-size:12.5px;font-family:inherit;cursor:pointer}
.progress{margin:16px 0 4px;background:var(--card);border-radius:var(--radius);padding:16px}
.progress .row{display:flex;justify-content:space-between;align-items:baseline}
.progress strong{font-size:22px}
.bar{height:8px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);
  padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.toggle.on{background:var(--good);border-color:var(--good);color:#fff}
h2{font-size:15px;margin:22px 4px 8px;color:var(--sub);font-weight:600}
.sec{display:flex;align-items:baseline;gap:6px;font-size:13px;margin:20px 4px 8px;color:var(--sub);font-weight:600}
.sec b{color:var(--text);font-size:15px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.card.done{opacity:.55}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;
  display:grid;place-items:center;color:#fff;font-size:15px;margin-top:2px;cursor:pointer;padding:0}
.card.done .check{background:var(--good);border-color:var(--good)}
.body{flex:1;min-width:0}
.title{font-weight:700;font-size:15px;word-break:keep-all}
.badge-new{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--new);border-radius:6px;
  padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.3px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--sub)}
.tag.reward{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.t-free{background:var(--good-soft);color:var(--good)}
.t-entry{background:var(--accent-soft);color:var(--accent)}
.t-cond{background:var(--warn-soft);color:var(--warn)}
.t-info{background:var(--line);color:var(--sub)}
.reward{font-weight:700;color:var(--good);font-size:14px;margin:2px 0 4px;word-break:keep-all}
.desc{color:var(--sub);font-size:13px;word-break:keep-all}
.cond{font-size:12.5px;color:var(--sub);margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:10px;word-break:keep-all}
.cond b{color:var(--text)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px;text-decoration:none;
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-family:inherit}
.btn.go{background:var(--accent);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text)}
.btn.joined{background:var(--good-soft);color:var(--good)}
.btn.small{padding:7px 11px;font-size:12.5px}
.btn[disabled]{opacity:.4}
.src{display:inline-block;margin-top:8px;font-size:12px;color:var(--sub)}
.note{background:var(--card);border-radius:var(--radius);padding:14px;font-size:13px;color:var(--sub);margin-top:10px}
.note b{color:var(--text)}
ul.points{margin:6px 0 0;padding-left:18px;color:var(--sub);font-size:13px}
ul.points li{margin:2px 0}
.dday{flex:none;text-align:center;min-width:62px;border-radius:12px;padding:8px 6px;background:var(--accent-soft);
  color:var(--accent);font-weight:800;font-size:15px;line-height:1.2}
.dday.txt{font-size:12.5px}
.dday small{display:block;font-size:10.5px;font-weight:600;opacity:.85;margin-top:2px}
.dday.warn{background:var(--warn-soft);color:var(--warn)}
.dday.bad{background:var(--bad-soft);color:var(--bad)}
.dday.muted{background:var(--line);color:var(--sub)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px;font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:10}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  nav.tabs{background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:none;color:var(--sub);font-size:11px;font-weight:600;padding:6px 0;font-family:inherit;cursor:pointer}
nav.tabs button span{display:block;font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--sub);font-size:13.5px}
.sheet .btn{width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:8px}
label.f{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;padding:10px;border-radius:9px;font-weight:700;color:var(--sub);font-family:inherit;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:13.5px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:9px 16px;border-radius:18px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;
  max-width:88vw;width:max-content;text-align:center;word-break:keep-all}
.toast.show{opacity:1}
.region{margin-top:14px}
.region-seg button{padding:9px 4px;font-size:13px}
.region-status{font-size:12px;color:var(--sub);margin:8px 4px 0;line-height:1.7;word-break:keep-all}
.linkbtn{border:none;background:none;color:var(--accent);font-weight:700;font-size:12px;padding:0;font-family:inherit;cursor:pointer;text-decoration:underline}
.update{display:block;background:var(--accent);color:#fff;border-radius:12px;padding:11px 12px;font-size:13px;margin-top:12px;font-weight:700;
  border:none;width:100%;text-align:left;font-family:inherit;cursor:pointer}
.gicon{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:22px}
.tagline{color:var(--text);font-weight:600;font-size:13.5px;margin-top:2px;word-break:keep-all}
ol.how{margin:8px 0 0;padding-left:20px;color:var(--sub);font-size:13px}
ol.how li{margin:2px 0}
.trow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:none;border-radius:var(--radius);
  padding:14px;margin-bottom:10px;text-align:left;font-family:inherit;color:var(--text);cursor:pointer}
.trow .tt{flex:1;min-width:0}
.trow b{display:block;font-size:14.5px}
.trow small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px;word-break:keep-all}
.sw{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--good)}
.sw.on::after{left:21px}
nav.tabs button{font-size:10.5px}
nav.tabs em{font-style:normal}
</style>
</head>
<body>
<div class="wrap">

<section id="view-deals">
  <header>
    <div class="head-row">
      <div>
        <h1 data-t="dealsTitle"></h1>
        <p id="deals-updated"></p>
      </div>
      <div style="display:flex;gap:6px;flex:none">
        <button class="refresh" id="lang-btn"></button>
        <button class="refresh" id="refresh-btn"></button>
      </div>
    </div>
  </header>
  <button id="update-banner" class="update hidden" data-t="updateBanner"></button>
  <div id="load-banner" class="banner hidden"></div>
  <div class="region" id="deals-region"></div>
  <div class="chips" id="deal-chips"></div>
  <div id="deals-list"></div>
  <div class="note" data-th="dealsNote"></div>
</section>

<section id="view-daily" class="hidden">
  <header>
    <h1 data-t="dailyTitle"></h1>
    <p id="today-label"></p>
  </header>
  <div class="region" id="daily-region"></div>
  <div class="progress">
    <div class="row"><span data-t="claimedToday"></span><strong id="prog-num">0 / 0</strong></div>
    <div class="bar"><i id="prog-bar" style="width:0"></i></div>
  </div>
  <div class="chips" id="daily-chips"></div>
  <div id="daily-list"></div>
  <div class="note" data-th="dailyNote"></div>
</section>

<section id="view-guides" class="hidden">
  <header>
    <h1 data-t="guidesTitle"></h1>
    <p id="guides-sub"></p>
  </header>
  <div class="region" id="guides-region"></div>
  <div class="chips" id="guide-chips"></div>
  <div id="guides-list"></div>
  <div class="note" data-th="guidesNote"></div>
</section>

<section id="view-wallet" class="hidden">
  <header>
    <h1 data-t="walletTitle"></h1>
    <p data-t="walletSub"></p>
  </header>
  <div id="wallet-list" style="margin-top:16px"></div>
  <button class="btn go" style="width:100%;justify-content:center;padding:13px" id="add-wallet-btn" data-t="walletAdd"></button>
  <div class="note" data-th="walletNote"></div>
</section>

<section id="view-settings" class="hidden">
  <header>
    <h1 data-t="settingsTitle"></h1>
    <p data-t="settingsSub"></p>
  </header>
  <h2 data-t="langHead"></h2>
  <div class="seg" id="seg-lang">
    <button data-lang="ko">한국어</button>
    <button data-lang="en">English</button>
  </div>

  <h2 data-t="regionHead"></h2>
  <div id="settings-region"></div>
  <div class="note" data-th="regionNote"></div>

  <h2 data-t="sgHead"></h2>
  <div id="settings-toggles"></div>

  <h2 data-t="modeHead"></h2>
  <div class="seg" id="seg-mode">
    <button data-mode="direct" data-t="modeDirect"></button>
    <button data-mode="confirm" data-t="modeConfirm"></button>
  </div>
  <div class="note" id="mode-note"></div>

  <h2 data-t="customHead"></h2>
  <div id="custom-list"></div>
  <button class="btn ghost" style="width:100%;justify-content:center;padding:13px;background:var(--card)" id="add-custom-btn" data-t="customAdd"></button>

  <h2 data-t="hiddenHead"></h2>
  <div id="hidden-list"></div>

  <h2 data-t="etcHead"></h2>
  <button class="btn ghost" style="width:100%;justify-content:center;padding:13px;background:var(--card)" id="reset-today" data-t="resetToday"></button>
  <div class="note"><span data-t="dataNote"></span> <b id="data-date">–</b></div>
</section>

</div>

<nav class="tabs"><div class="in">
  <button data-tab="deals" class="on"><span>🎁</span><em data-t="tabDeals"></em></button>
  <button data-tab="daily"><span>✅</span><em data-t="tabDaily"></em></button>
  <button data-tab="guides"><span>🧭</span><em data-t="tabGuides"></em></button>
  <button data-tab="wallet"><span>💳</span><em data-t="tabWallet"></em></button>
  <button data-tab="settings"><span>⚙️</span><em data-t="tabSettings"></em></button>
</div></nav>

<div class="sheet-bg" id="go-sheet"><div class="sheet">
  <h3 id="go-title"></h3>
  <p id="go-desc"></p>
  <a class="btn go" id="go-link" href="#" data-t="go"></a>
  <button class="btn ghost" data-close data-t="cancel"></button>
</div></div>

<div class="sheet-bg" id="link-sheet"><div class="sheet">
  <h3 data-t="linkTitle"></h3>
  <p data-t="linkDesc"></p>
  <label class="f" data-t="linkLabel"></label>
  <input id="link-input" data-tp="linkPh" autocomplete="off" autocapitalize="off">
  <button class="btn go" id="link-save" data-t="save"></button>
  <button class="btn ghost" data-close data-t="cancel"></button>
</div></div>

<div class="sheet-bg" id="wallet-sheet"><div class="sheet">
  <h3 id="wallet-sheet-title"></h3>
  <label class="f" data-t="wType"></label>
  <select id="w-preset"></select>
  <label class="f" data-t="wName"></label>
  <input id="w-name" data-tp="wNamePh">
  <label class="f" data-t="wBalance"></label>
  <input id="w-balance" inputmode="numeric" data-tp="wBalancePh">
  <label class="f" data-t="wUnit"></label>
  <input id="w-unit" data-tp="wUnitPh">
  <label class="f" data-t="wExpiry"></label>
  <input id="w-expiry" type="date">
  <button class="btn go" id="w-save" data-t="save"></button>
  <button class="btn ghost hidden" id="w-delete" style="color:var(--bad)" data-t="delete"></button>
  <button class="btn ghost" data-close data-t="cancel"></button>
</div></div>

<div class="sheet-bg" id="custom-sheet"><div class="sheet">
  <h3 data-t="cTitle"></h3>
  <label class="f" data-t="wName"></label>
  <input id="c-title" data-tp="cTitlePh">
  <label class="f" data-t="cUrl"></label>
  <input id="c-url" data-tp="cUrlPh" autocomplete="off" autocapitalize="off">
  <label class="f" data-t="cReward"></label>
  <input id="c-reward" data-tp="cRewardPh">
  <button class="btn go" id="c-save" data-t="add"></button>
  <button class="btn ghost" data-close data-t="cancel"></button>
</div></div>

<div class="toast" id="toast"></div>

<script>
const APP_VERSION = "5";

/* ======================= 글자 (한국어 / English) ======================= */
const I18N = {

  appTitle:"줍줍 무료 보상 모음",

  freeOnly:"🎁 무료만 {n}", all:"전체",
  secNew:"🆕 <b>오늘 새로 올라온 혜택</b> {n}개", secOngoing:"⏰ <b>진행 중</b> 마감 임박순", secDone:"✓ <b>참여 완료</b> {n}개",
  emptyFree:"지금은 조건 없이 받는 무료 혜택이 없어요.<br>무료만 보기를 끄면 다른 혜택도 볼 수 있어요.",

  dealsNote:"이벤트는 예고 없이 바뀌거나 일찍 끝날 수 있어요. 참여 전에 <b>출처 페이지</b>에서 조건을 한 번 더 확인해 주세요.",

  dailyTitle:"매일 챙기기", todayLabel:"{M}월 {D}일 {W}요일 · 매일 받을 수 있는 소소한 보상", claimedToday:"오늘 챙긴 보상",

  myLink:"내 링크", appHome:"앱 첫 화면까지", noLink:"링크 없음", monthCount:"이번 달 {n}/5", open:"열기 ↗", openYourself:"앱에서 직접 열기", useMyLink:"내 링크로 바꾸기",
  emptyDailyRegion:"{r}에서 매일 챙길 항목이 아직 없어요.<br>설정에서 직접 추가할 수 있어요.", emptyCat:"이 분류에는 항목이 없어요",
  guidesTitle:"생활 혜택", guidesSubSg:"싱가포르에서 늘 쓸 수 있는 할인 앱과 제도예요", guidesSubKr:"한국에서 늘 쓸 수 있는 할인 앱과 제도예요", guidesSubAll:"늘 쓸 수 있는 할인 앱과 제도예요",

const store = {
  get(k, d){ try{ const v = localStorage.getItem("jupjup:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("jupjup:"+k, JSON.stringify(v)); }catch(e){} }
};
function defaultLang(){ try{ return /^ko/i.test(navigator.language||"") ? "ko" : "en"; }catch(e){ return "ko"; } }
const state = {
  lang: store.get("lang", null) || defaultLang(),
  mode: store.get("mode", "confirm"),
  done: store.get("done", {}), monthly: store.get("monthly", {}), links: store.get("links", {}),
  hidden: store.get("hidden", []), joined: store.get("joined", {}), custom: store.get("custom", []), wallet: store.get("wallet", []),
  freeOnly: store.get("freeOnly", false),

  showKrAbroad: store.get("showKrAbroad", null), showCitizen: store.get("showCitizen", false),
  dealFilter:"all", dailyFilter:"all", guideFilter:"all", loadStatus:"loading", lastFetch:0
};
if(state.showKrAbroad===null) state.showKrAbroad = state.lang==="ko";
if(!I18N[state.lang]) state.lang = "ko";
function save(){ ["lang","mode","done","monthly","links","hidden","joined","custom","wallet","freeOnly","region","regionAuto","regionVia","showKrAbroad","showCitizen"].forEach(k=>store.set(k, state[k])); }

/* ======================= 번역 도우미 ======================= */
function t(key, vars){
  let s = (I18N[state.lang] && I18N[state.lang][key]!=null) ? I18N[state.lang][key] : (I18N.ko[key]!=null ? I18N.ko[key] : key);
  if(vars) s = s.replace(/\{(\w+)\}/g, (_,k)=> vars[k]!=null ? vars[k] : "");
  return s;
}
// 데이터 항목의 글자: 영어면 en 필드, 없으면 한국어 그대로
function L(x, f){ if(state.lang==="en" && x && x.en && x.en[f]!=null) return x.en[f]; return x ? x[f] : ""; }
function N(o, short){ if(!o) return ""; const k = (short?"s":"")+state.lang; return o[k]!=null ? o[k] : (o[short?"sko":"ko"]||""); }
function rName(r){ return REGIONS[r] ? REGIONS[r][state.lang] : ""; }
function applyStatic(){
  document.documentElement.lang = state.lang;
  document.title = t("appTitle");
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-th]").forEach(el=>{ el.innerHTML = t(el.dataset.th); });
  document.querySelectorAll("[data-tp]").forEach(el=>{ el.placeholder = t(el.dataset.tp); });
  $("#lang-btn").textContent = t("langBtn");
  $("#refresh-btn").textContent = t("refresh");
  document.querySelectorAll("#seg-lang button").forEach(b=>b.classList.toggle("on", b.dataset.lang===state.lang));
  $("#w-preset").innerHTML = WALLET_PRESETS.map((p,i)=>`<option value="${i}">${esc(p[state.lang]||p.ko)}</option>`).join("");
}
function setLang(l){
  if(!I18N[l] || l===state.lang) return;
  state.lang = l;
  state.showKrAbroad = l==="ko";   // 영어 사용자는 한국 앱 혜택이 기본으로 안 보이게
  save(); applyStatic(); render(); toast(t("toastLang"));
}

/* ======================= 데이터 ======================= */
function normalize(j){
  const out = {updated:null, deals:[], daily:[], guides:[]};
  if(!j || typeof j!=="object") return out;
  const ok = x => x && typeof x==="object" && typeof x.id==="string" && typeof x.title==="string";
  out.updated = typeof j.updated==="string" ? j.updated : null;
  ["deals","daily","guides"].forEach(k=>{ out[k] = Array.isArray(j[k]) ? j[k].filter(ok) : []; });
  return out;
}
let DATA = normalize(store.get("data", null));
function hasData(){ return DATA.deals.length>0 || DATA.daily.length>0; }
async function loadData(){
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    DATA = normalize(j); store.set("data", j); state.loadStatus = "ok";
  }catch(e){ state.loadStatus = hasData() ? "cached" : "error"; }
  state.lastFetch = Date.now();
  render();
}

const $ = s => document.querySelector(s);
function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function monthKey(){ return todayKey().slice(0,7); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function daysUntil(iso){
  if(!iso || typeof iso!=="string") return null;
  const tt = new Date(todayKey()+"T00:00:00"), d = new Date(iso.slice(0,10)+"T00:00:00");
  if(isNaN(d)) return null;
  return Math.round((d-tt)/86400000);
}
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtMD(iso){ const p = String(iso).slice(0,10).split("-"); return Number(p[1])+"/"+Number(p[2]); }
function fmtUpdated(s){
  const d = new Date(s); if(isNaN(d)) return "";
  const hm = pad(d.getHours())+":"+pad(d.getMinutes());
  return state.lang==="en" ? `${d.getDate()} ${MON[d.getMonth()]} ${hm}` : `${d.getMonth()+1}월 ${d.getDate()}일 ${hm}`;
}
function ddayLabel(n){ if(n==null) return "–"; if(n===0) return "D-DAY"; return n>0 ? "D-"+n : "D+"+(-n); }
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(el._h); el._h=setTimeout(()=>el.classList.remove("show"),1800); }
function isWeb(u){ return /^https?:\/\//i.test(u||""); }
function safeUrl(u){
  u = (u||"").trim(); if(!u) return "";
  if(/^\s*(javascript|data|vbscript|file):/i.test(u)) return "";
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(u)) u = "https://"+u;
  return u;
}
function targetAttr(url){ return isWeb(url) ? 'target="_blank" rel="noopener"' : ""; }

/* ======================= 지역 ======================= */
function regionFromTZ(){
  let tz = ""; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; }catch(e){}
  if(tz==="Asia/Seoul") return "kr";
  if(tz==="Asia/Singapore") return "sg";
  return null;
}
function regionFromCoords(lat, lng){
  if(lat>=33 && lat<=38.9 && lng>=124 && lng<=132) return "kr";
  if(lat>=1.13 && lat<=1.48 && lng>=103.55 && lng<=104.1) return "sg";
  return null;
}
function applyAutoRegion(){
  const gps = store.get("gps", null), tz = regionFromTZ();
  if(gps && gps.region && Date.now()-gps.at < 12*3600*1000){ state.region = gps.region; state.regionVia = "gps"; }
  else if(tz){ state.region = tz; state.regionVia = "tz"; }
  else { state.region = "all"; state.regionVia = "unknown"; }
  save();
}
function itemRegion(x){ return x.region || (x.cat==="sg" ? "sg" : "kr"); }
function inRegion(x){
  const r = itemRegion(x);
  if(r==="sg" && x.citizen_only && !state.showCitizen) return false;
  if(state.region==="all" || r==="global") return true;
  if(state.region==="kr") return r==="kr";
  if(state.region==="sg") return r==="sg" || (r==="kr" && x.abroad!==false && state.showKrAbroad);
  return false;
}
function eligTag(x){
  if(state.region==="kr") return "";
  const r = itemRegion(x);
  if(r==="kr") return x.abroad===false ? `<span class="tag bad">${t("eKrOnly")}</span>` : `<span class="tag">${t("eKrAbroad")}</span>`;
  if(r==="sg") return x.citizen_only ? `<span class="tag warn">${t("eSgCitizen")}</span>` : `<span class="tag">${t("eSgOpen")}</span>`;
  return "";
}
function locate(){
  if(!navigator.geolocation){ toast(t("locNo")); return; }
  toast(t("locating"));
  navigator.geolocation.getCurrentPosition(pos=>{
    const r = regionFromCoords(pos.coords.latitude, pos.coords.longitude);
    store.set("gps", {region: r || "all", at: Date.now()});
    state.regionAuto = true; state.region = r || "all"; state.regionVia = "gps";
    save(); render();
    toast(r ? t("locFound",{r:rName(r)}) : t("locOutside"));
  }, err=>{ toast(err && err.code===1 ? t("locDenied") : t("locFail")); },
  {enableHighAccuracy:false, timeout:10000, maximumAge:10*60*1000});
}
function regionBar(){
  const segs = ["kr","sg","all"].map(r=>`<button class="${state.region===r?"on":""}" data-region="${r}">${REGIONS[r].flag} ${rName(r)}</button>`).join("");
  const extra = state.region==="sg" ? " · "+(state.showKrAbroad ? t("sgExtraKr") : t("sgExtraSg")) : "";
  let status;
  if(state.regionAuto){
    const via = state.regionVia==="gps" ? t("viaGps") : state.regionVia==="unknown" ? t("viaUnknown") : t("viaTz");
    status = `${t("rAuto")} · ${via} ${rName(state.region)}${extra} · <button class="linkbtn" data-locate>${t("locateBtn")}</button>`;
  } else {
    status = `${t("rManual")}${extra} · <button class="linkbtn" data-autoregion>${t("autoBtn")}</button>`;
  }
  return `<div class="seg region-seg">${segs}</div><div class="region-status">${status}</div>`;
}
function renderRegion(){
  const html = regionBar();
  ["#deals-region","#daily-region","#guides-region","#settings-region"].forEach(id=>{ const el=$(id); if(el) el.innerHTML = html; });
}

/* ======================= 새 버전 확인 ======================= */
async function checkVersion(){
  try{
    const r = await fetch("version.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const v = await r.json();
    if(!v || !v.app || String(v.app)===APP_VERSION) return;
    let tried = null; try{ tried = sessionStorage.getItem("jupjup:reloadFor"); }catch(e){}
    if(tried!==String(v.app)){
      try{ sessionStorage.setItem("jupjup:reloadFor", String(v.app)); }catch(e){}
      location.replace(location.pathname+"?v="+encodeURIComponent(v.app));
    } else $("#update-banner").classList.remove("hidden");
  }catch(e){}
}
$("#update-banner").addEventListener("click", ()=>{ location.replace(location.pathname+"?v="+Date.now()); });

/* ======================= 한정 혜택 ======================= */
function activeDeals(){
  return DATA.deals.filter(d=>{
    if(state.hidden.includes(d.id)) return false;
    const dd = daysUntil(d.end); return !(dd!=null && dd<0);
  });
}
function dealCard(d){
  const dd = daysUntil(d.end), joined = !!state.joined[d.id], isNew = d.added===todayKey();
  const type = TYPES[d.type] || TYPES.info, cat = CATS[d.cat] || CATS.etc;
  const url = safeUrl(d.url), src = safeUrl(d.source_url);
  let box;
  if(dd!=null){
    const cls = d.type==="info" ? (dd<=14?"warn":"") : (dd<=3?"bad":dd<=10?"warn":"");
    box = `<div class="dday ${cls}">${ddayLabel(dd)}<small>${d.type==="info" ? fmtMD(d.end) : t("until",{d:fmtMD(d.end)})}</small></div>`;
  } else {
    box = `<div class="dday txt muted">${esc(L(d,"badge") || (d.type==="info"?t("badgeInfo"):t("badgeAlways")))}</div>`;
  }
  const period = d.start && d.end ? `${fmtMD(d.start)} ~ ${fmtMD(d.end)}` : "";
  const jl = d.type==="info" ? (joined?t("infoDoneOn"):t("infoDone")) : (joined?t("joinDoneOn"):t("joinDone"));
  const pts = L(d,"points");
  return `<div class="card ${joined?"done":""}">
    ${box}
    <div class="body">
      <div class="title">${esc(L(d,"title"))}${isNew&&!joined?'<span class="badge-new">NEW</span>':""}</div>
      <div class="meta">
        <span class="tag ${type.cls}">${type[state.lang]}</span>
        <span class="tag plain">${esc(N(cat))}</span>
        ${eligTag(d)}
        ${period?`<span class="tag plain">${period}</span>`:""}
      </div>
      ${L(d,"reward")?`<div class="reward">${esc(L(d,"reward"))}</div>`:""}
      ${L(d,"desc")?`<div class="desc">${esc(L(d,"desc"))}</div>`:""}
      ${Array.isArray(pts)&&pts.length?`<ul class="points">${pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
      ${L(d,"condition")?`<div class="cond"><b>${t("terms")}</b> ${esc(L(d,"condition"))}</div>`:""}
      <div class="actions">
        ${url?`<a class="btn go small" data-godeal="${esc(d.id)}" href="${esc(url)}" ${targetAttr(url)}>${esc(L(d,"cta")||t("join"))} ↗</a>`:""}
        <button class="btn small ${joined?"joined":"ghost"}" data-join="${esc(d.id)}">${jl}</button>
        <button class="btn ghost small" data-hide="${esc(d.id)}">${t("hide")}</button>
      </div>
      ${src && src!==url?`<a class="src" href="${esc(src)}" target="_blank" rel="noopener">${t("source")}</a>`:""}
    </div>
  </div>`;
}
function renderDeals(){
  $("#deals-updated").textContent = DATA.updated ? t("updated",{d:fmtUpdated(DATA.updated)}) : (state.loadStatus==="loading" ? t("loading") : t("noData"));
  const b = $("#load-banner");
  if(state.loadStatus==="cached"){ b.textContent=t("cached"); b.classList.remove("hidden"); }
  else if(state.loadStatus==="error"){ b.textContent=t("loadError"); b.classList.remove("hidden"); }
  else b.classList.add("hidden");

  const all = activeDeals().filter(inRegion);
  const cats = [...new Set(all.map(d=>d.cat))].filter(c=>CATS[c]);
  if(state.dealFilter!=="all" && !cats.includes(state.dealFilter)) state.dealFilter="all";
  const freeCount = all.filter(d=>d.type==="free").length;
  $("#deal-chips").innerHTML =
    `<button class="chip toggle ${state.freeOnly?"on":""}" data-freeonly>${t("freeOnly",{n:freeCount})}</button>`+
    `<button class="chip ${state.dealFilter==="all"?"on":""}" data-dfilter="all">${t("all")}</button>`+
    cats.map(c=>`<button class="chip ${state.dealFilter===c?"on":""}" data-dfilter="${c}">${esc(N(CATS[c],true))}</button>`).join("");

  const list = all.filter(d=>(state.dealFilter==="all"||d.cat===state.dealFilter) && (!state.freeOnly||d.type==="free"));
  const sk = d => { const n = daysUntil(d.end); return n==null ? 9999 : n; };
  const rank = {free:0, entry:1, cond:2, info:3};
  list.sort((a,b)=> sk(a)-sk(b) || (rank[a.type]??9)-(rank[b.type]??9));
  const today = todayKey(), J = d => !!state.joined[d.id];
  const fresh = list.filter(d=>d.added===today && !J(d)), rest = list.filter(d=>d.added!==today && !J(d)), joined = list.filter(J);
  let html = "";
  if(!list.length){
    if(state.freeOnly) html = `<div class="empty">${t("emptyFree")}</div>`;
    else if(state.loadStatus==="loading") html = `<div class="empty">${t("loading")}</div>`;
    else if(state.region!=="all") html = `<div class="empty">${t("emptyRegion",{r:rName(state.region)})}</div>`;
    else html = `<div class="empty">${t("emptyAll")}</div>`;
  } else {
    if(fresh.length) html += `<div class="sec">${t("secNew",{n:fresh.length})}</div>` + fresh.map(dealCard).join("");
    if(rest.length) html += `<div class="sec">${t("secOngoing")}</div>` + rest.map(dealCard).join("");
    if(joined.length) html += `<div class="sec">${t("secDone",{n:joined.length})}</div>` + joined.map(dealCard).join("");
  }
  $("#deals-list").innerHTML = html;
}

/* ======================= 매일 챙기기 ======================= */
function allDaily(){
  const custom = state.custom.map(c=>({id:c.id, cat:"mine", region:"global", title:c.title, reward:c.reward||"", freq:"daily",
    desc:"", url:c.url, linkKind:c.url?(isWeb(c.url)?"web":"app"):"none", custom:true}));
  return DATA.daily.concat(custom);
}
function linkOf(it){ return safeUrl(state.links[it.id] || it.url || ""); }
function isDone(it){ return !!(state.done[todayKey()]||{})[it.id]; }
function monthCount(id){ return ((state.monthly[monthKey()]||{})[id])||0; }
function toggleDone(it){
  const k = todayKey(); state.done[k] = state.done[k]||{};
  const was = !!state.done[k][it.id];
  if(was) delete state.done[k][it.id]; else state.done[k][it.id] = true;
  if(it.freq==="monthly5"){
    const m = monthKey(); state.monthly[m] = state.monthly[m]||{};
    state.monthly[m][it.id] = Math.max(0,(state.monthly[m][it.id]||0)+(was?-1:1));
  }
  Object.keys(state.done).forEach(d=>{ if(d<k) delete state.done[d]; });
  save(); render();
}
function markDoneSoon(it){ if(!isDone(it)) setTimeout(()=>{ if(!isDone(it)) toggleDone(it); }, 400); }
function renderDaily(){
  const d = new Date();
  const W = state.lang==="en" ? ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()] : ["일","월","화","수","목","금","토"][d.getDay()];
  $("#today-label").textContent = t("todayLabel",{M:d.getMonth()+1, D:d.getDate(), W, MON:MON[d.getMonth()]});
  const items = allDaily().filter(it=>!state.hidden.includes(it.id)).filter(inRegion);
  const cats = [...new Set(items.map(i=>i.cat))].filter(c=>CATS[c]);
  if(state.dailyFilter!=="all" && !cats.includes(state.dailyFilter)) state.dailyFilter="all";
  $("#daily-chips").innerHTML = [`<button class="chip ${state.dailyFilter==="all"?"on":""}" data-filter="all">${t("all")}</button>`]
    .concat(cats.map(c=>`<button class="chip ${state.dailyFilter===c?"on":""}" data-filter="${c}">${esc(N(CATS[c],true))}</button>`)).join("");
  const doneCount = items.filter(isDone).length;
  $("#prog-num").textContent = doneCount+" / "+items.length;
  $("#prog-bar").style.width = (items.length ? doneCount/items.length*100 : 0)+"%";
  const used = it => isDone(it) || (it.freq==="monthly5" && monthCount(it.id)>=5);
  const visible = items.filter(it=>state.dailyFilter==="all"||it.cat===state.dailyFilter).sort((a,b)=>used(a)-used(b));
  $("#daily-list").innerHTML = visible.length ? visible.map(it=>{
    const done = isDone(it), url = linkOf(it), mine = !!state.links[it.id], cat = CATS[it.cat] || CATS.etc;
    let kindTag = "";
    if(mine) kindTag = `<span class="tag">${t("myLink")}</span>`;
    else if(it.linkKind==="app") kindTag = `<span class="tag warn">${t("appHome")}</span>`;
    else if(it.linkKind==="none") kindTag = `<span class="tag bad">${t("noLink")}</span>`;
    const freqTag = it.freq==="monthly5" ? `<span class="tag">${t("monthCount",{n:monthCount(it.id)})}</span>` : "";
    return `<div class="card ${done?"done":""}">
      <button class="check" data-check="${esc(it.id)}" aria-label="${t("markDone")}">${done?"✓":""}</button>
      <div class="body">
        <div class="title">${esc(L(it,"title"))}</div>
        <div class="meta">
          <span class="tag plain">${esc(N(cat))}</span>
          ${L(it,"reward")?`<span class="tag reward">${esc(L(it,"reward"))}</span>`:""}
          ${it.custom?"":eligTag(it)}${freqTag}${kindTag}
        </div>
        ${L(it,"desc")?`<div class="desc">${esc(L(it,"desc"))}</div>`:""}
        <div class="actions">
          ${url?`<a class="btn go small" data-go="${esc(it.id)}" href="${esc(url)}" ${targetAttr(url)}>${t("open")}</a>`:`<button class="btn go small" disabled>${t("openYourself")}</button>`}
          ${it.custom?"":`<button class="btn ghost small" data-editlink="${esc(it.id)}">${t("useMyLink")}</button>`}
          <button class="btn ghost small" data-hide="${esc(it.id)}">${t("hide")}</button>
        </div>
      </div>
    </div>`;
  }).join("") : `<div class="empty">${state.region!=="all"&&!items.length ? t("emptyDailyRegion",{r:rName(state.region)}) : t("emptyCat")}</div>`;
}

  return `<div class="card">
    <div class="gicon">${esc(g.icon||"✨")}</div>
    <div class="body">
      <div class="title">${esc(L(g,"title"))}${g.added===todayKey()?'<span class="badge-new">NEW</span>':""}</div>
      ${L(g,"tagline")?`<div class="tagline">${esc(L(g,"tagline"))}</div>`:""}
      <div class="meta">
        ${L(g,"saving")?`<span class="tag reward">${esc(L(g,"saving"))}</span>`:""}
        ${L(g,"cost")?`<span class="tag plain">${esc(L(g,"cost"))}</span>`:""}
        ${eligTag(g)}
      </div>
      ${L(g,"desc")?`<div class="desc">${esc(L(g,"desc"))}</div>`:""}
      ${Array.isArray(how)&&how.length?`<ol class="how">${how.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""}
      ${L(g,"tip")?`<div class="cond"><b>${t("tip")}</b> ${esc(L(g,"tip"))}</div>`:""}
      <div class="actions">
        ${url?`<a class="btn go small" data-goguide="${esc(g.id)}" href="${esc(url)}" ${targetAttr(url)}>${esc(L(g,"cta")||t("openDefault"))} ↗</a>`:""}
        <button class="btn ghost small" data-hide="${esc(g.id)}">${t("hide")}</button>
      </div>
      ${src && src!==url?`<a class="src" href="${esc(src)}" target="_blank" rel="noopener">${t("source")}</a>`:""}
    </div>
  </div>`;
}
function renderGuides(){
  const r = state.region;
  $("#guides-sub").textContent = r==="sg" ? t("guidesSubSg") : r==="kr" ? t("guidesSubKr") : t("guidesSubAll");
  const all = DATA.guides.filter(g=>!state.hidden.includes(g.id)).filter(inRegion);
  const order = Object.keys(GROUPS), idx = k => { const i = order.indexOf(k); return i<0 ? 99 : i; };
  const groups = [...new Set(all.map(g=>g.group))].filter(k=>GROUPS[k]).sort((a,b)=>idx(a)-idx(b));
  if(state.guideFilter!=="all" && !groups.includes(state.guideFilter)) state.guideFilter="all";
  $("#guide-chips").innerHTML = `<button class="chip ${state.guideFilter==="all"?"on":""}" data-gfilter="all">${t("all")}</button>`+
    groups.map(k=>`<button class="chip ${state.guideFilter===k?"on":""}" data-gfilter="${k}">${GROUPS[k].icon} ${GROUPS[k][state.lang]}</button>`).join("");
  const list = all.filter(g=>state.guideFilter==="all"||g.group===state.guideFilter).sort((a,b)=>idx(a.group)-idx(b.group));
  let html = "", cur = null;
  list.forEach(g=>{
    if(g.group!==cur){ cur = g.group; const G = GROUPS[cur] || {ko:"기타",en:"Other",icon:"✨"}; html += `<div class="sec">${G.icon} <b>${G[state.lang]}</b></div>`; }
    html += guideCard(g);
  });
  $("#guides-list").innerHTML = html || `<div class="empty">${r==="kr" ? t("guidesEmptyKr") : t("guidesEmpty")}</div>`;
}

/* ======================= 내 포인트 ======================= */
function renderWallet(){
  const list = state.wallet.slice().sort((a,b)=>{
    const da = a.expiry ? daysUntil(a.expiry) : 99999, db = b.expiry ? daysUntil(b.expiry) : 99999; return da-db;
  });
  $("#wallet-list").innerHTML = list.length ? list.map(w=>{
    const dd = w.expiry ? daysUntil(w.expiry) : null;
    const cls = dd==null ? "muted" : dd<0 ? "bad" : dd<=30 ? "bad" : dd<=90 ? "warn" : "";
    const bal = w.balance!=="" && w.balance!=null ? Number(w.balance).toLocaleString(state.lang==="en"?"en-SG":"ko-KR")+" "+esc(w.unit||"") : t("noBalance");
    return `<div class="card" data-wallet="${esc(w.id)}" style="cursor:pointer">
      <div class="dday ${cls} ${dd==null?"txt":""}">${dd==null?t("noExpiry"):ddayLabel(dd)}${w.expiry?`<small>${esc(w.expiry.slice(2).split("-").join("/"))}</small>`:""}</div>
      <div class="body">
        <div class="title">${esc(w.name)}</div>
        <div class="desc" style="font-size:15px;color:var(--text);font-weight:700;margin-top:2px">${bal}</div>
        ${dd!=null&&dd>=0&&dd<=30?`<div class="desc" style="color:var(--bad);margin-top:4px">${t("expSoon")}</div>`:""}
        ${dd!=null&&dd<0?`<div class="desc" style="color:var(--bad);margin-top:4px">${t("expPast")}</div>`:""}
      </div>
    </div>`;
  }).join("") : `<div class="empty">${t("walletEmpty")}</div>`;
}

function openSheet(id){ $(id).classList.add("open"); }
function closeSheets(){ document.querySelectorAll(".sheet-bg").forEach(s=>s.classList.remove("open")); }
document.querySelectorAll(".sheet-bg").forEach(bg=>{
  bg.addEventListener("click", e=>{ if(e.target===bg || e.target.hasAttribute("data-close")) closeSheets(); });
});
function handleGo(e, title, url, after){
  if(!url){ e.preventDefault(); return; }
  if(state.mode==="confirm"){
    e.preventDefault();
    $("#go-title").textContent = title;
    $("#go-desc").textContent = isWeb(url) ? t("goWeb") : t("goApp");
    const a = $("#go-link"); a.href = url;
    if(isWeb(url)){ a.target="_blank"; a.rel="noopener"; } else { a.removeAttribute("target"); a.removeAttribute("rel"); }
    a.onclick = ()=>{ if(after) after(); setTimeout(closeSheets, 50); };
    openSheet("#go-sheet");
  } else if(after){ after(); }
}
let editingLinkId = null, editingWalletId = null;
function switchTab(name){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===name));
  ["deals","daily","guides","wallet","settings"].forEach(v=>$("#view-"+v).classList.toggle("hidden", v!==name));
  try{ window.scrollTo(0,0); }catch(e){}
}

/* ======================= 이벤트 ======================= */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-tab],[data-lang],[data-region],[data-locate],[data-autoregion],[data-toggle],[data-gfilter],[data-goguide],[data-dfilter],[data-freeonly],[data-filter],[data-mode],[data-check],[data-go],[data-godeal],[data-join],[data-editlink],[data-hide],[data-unhide],[data-delcustom],[data-wallet]");
  if(!el) return;
  const ds = el.dataset;
  if(ds.tab!==undefined){ switchTab(ds.tab); return; }
  if(ds.lang!==undefined){ setLang(ds.lang); return; }
  if(ds.region!==undefined){
    const wasAuto = state.regionAuto;
    state.region = ds.region; state.regionAuto = false; state.regionVia = "manual";
    save(); render(); toast(t(wasAuto?"toastRegionAutoOff":"toastRegion",{r:rName(ds.region)})); return;
  }
  if(ds.locate!==undefined){ locate(); return; }
  if(ds.autoregion!==undefined){ state.regionAuto = true; applyAutoRegion(); render(); toast(t("toastAuto",{r:rName(state.region)})); return; }
  if(ds.toggle!==undefined){
    const k = ds.toggle; if(!(k in state)) return;
    state[k] = !state[k]; save(); render(); toast(state[k] ? t("on") : t("off")); return;
  }
  if(ds.gfilter!==undefined){ state.guideFilter = ds.gfilter; renderGuides(); return; }
  if(ds.goguide!==undefined){ const g = DATA.guides.find(x=>x.id===ds.goguide); if(g) handleGo(e, L(g,"title"), safeUrl(g.url), null); return; }
  if(ds.dfilter!==undefined){ state.dealFilter = ds.dfilter; renderDeals(); return; }
  if(ds.freeonly!==undefined){ state.freeOnly = !state.freeOnly; save(); renderDeals(); return; }
  if(ds.filter!==undefined){ state.dailyFilter = ds.filter; renderDaily(); return; }
  if(ds.mode!==undefined){ state.mode = ds.mode; save(); renderSettings(); toast(state.mode==="direct"?t("toastModeDirect"):t("toastModeConfirm")); return; }
  if(ds.check!==undefined){ const it = allDaily().find(i=>i.id===ds.check); if(it) toggleDone(it); return; }
  if(ds.go!==undefined){ const it = allDaily().find(i=>i.id===ds.go); if(it) handleGo(e, L(it,"title"), linkOf(it), ()=>markDoneSoon(it)); return; }
  if(ds.godeal!==undefined){ const d = DATA.deals.find(x=>x.id===ds.godeal); if(d) handleGo(e, L(d,"title"), safeUrl(d.url), null); return; }
  if(ds.join!==undefined){
    if(state.joined[ds.join]) delete state.joined[ds.join]; else state.joined[ds.join] = todayKey();
    const ids = new Set(DATA.deals.map(d=>d.id));
    if(ids.size) Object.keys(state.joined).forEach(id=>{ if(!ids.has(id)) delete state.joined[id]; });
    save(); renderDeals(); if(state.joined[ds.join]) toast(t("toastJoined")); return;
  }
  if(ds.editlink!==undefined){ editingLinkId = ds.editlink; $("#link-input").value = state.links[editingLinkId] || ""; openSheet("#link-sheet"); return; }
  if(ds.hide!==undefined){ if(!state.hidden.includes(ds.hide)) state.hidden.push(ds.hide); save(); render(); toast(t("toastHidden")); return; }
  if(ds.unhide!==undefined){ state.hidden = state.hidden.filter(x=>x!==ds.unhide); save(); render(); return; }
  if(ds.delcustom!==undefined){ state.custom = state.custom.filter(c=>c.id!==ds.delcustom); save(); render(); return; }
  if(ds.wallet!==undefined){ openWallet(ds.wallet); return; }
});
$("#lang-btn").addEventListener("click", ()=> setLang(state.lang==="ko" ? "en" : "ko"));
$("#refresh-btn").addEventListener("click", async ()=>{
  const b = $("#refresh-btn"); b.textContent = t("loading"); b.disabled = true;
  await loadData(); b.textContent = t("refresh"); b.disabled = false;
  toast(state.loadStatus==="ok" ? t("latest") : t("loadFail"));
});
$("#link-save").addEventListener("click", ()=>{
  const v = safeUrl($("#link-input").value);
  if(v) state.links[editingLinkId] = v; else delete state.links[editingLinkId];
  save(); closeSheets(); render(); toast(v ? t("toastMyLink") : t("toastDefaultLink"));
});
$("#add-custom-btn").addEventListener("click", ()=>{ $("#c-title").value=""; $("#c-url").value=""; $("#c-reward").value=""; openSheet("#custom-sheet"); });
$("#c-save").addEventListener("click", ()=>{
  const title = $("#c-title").value.trim(); if(!title){ toast(t("needName")); return; }
  state.custom.push({id:"c"+Date.now(), title, url:safeUrl($("#c-url").value), reward:$("#c-reward").value.trim()});
  save(); closeSheets(); render(); toast(t("toastCustom"));
});
$("#reset-today").addEventListener("click", ()=>{
  const k = todayKey(), m = monthKey();
  Object.keys(state.done[k]||{}).forEach(id=>{
    const it = allDaily().find(d=>d.id===id);
    if(it && it.freq==="monthly5" && state.monthly[m]) state.monthly[m][id] = Math.max(0,(state.monthly[m][id]||1)-1);
  });
  state.done[k] = {}; save(); render(); toast(t("toastReset"));
});
$("#w-preset").addEventListener("change", e=>{
  const p = WALLET_PRESETS[e.target.value];
  if(e.target.value!=="0"){ $("#w-name").value = p[state.lang]||p.ko; $("#w-unit").value = state.lang==="en"&&p.unit==="마일" ? "miles" : p.unit; }
});
$("#add-wallet-btn").addEventListener("click", ()=>openWallet(null));
function openWallet(id){
  editingWalletId = id;
  const w = id ? state.wallet.find(x=>x.id===id) : null;
  $("#wallet-sheet-title").textContent = w ? t("wEditTitle") : t("wAddTitle");
  $("#w-preset").value = "0";
  $("#w-name").value = w ? w.name : ""; $("#w-balance").value = w ? (w.balance??"") : "";
  $("#w-unit").value = w ? (w.unit||"") : ""; $("#w-expiry").value = w ? (w.expiry||"") : "";
  $("#w-delete").classList.toggle("hidden", !w);
  openSheet("#wallet-sheet");
}
$("#w-save").addEventListener("click", ()=>{
  const name = $("#w-name").value.trim(); if(!name){ toast(t("needName")); return; }
  const rec = {name, balance:$("#w-balance").value.replace(/[^\d.]/g,""), unit:$("#w-unit").value.trim(), expiry:$("#w-expiry").value};
  const cur = editingWalletId && state.wallet.find(x=>x.id===editingWalletId);
  if(cur) Object.assign(cur, rec); else state.wallet.push(Object.assign({id:"w"+Date.now()}, rec));
  save(); closeSheets(); render(); toast(t("saved"));
});
$("#w-delete").addEventListener("click", ()=>{ state.wallet = state.wallet.filter(x=>x.id!==editingWalletId); save(); closeSheets(); render(); toast(t("deleted")); });

/* ======================= 시작 ======================= */
let lastDay = todayKey();
setInterval(()=>{ if(todayKey()!==lastDay){ lastDay = todayKey(); loadData(); } }, 60000);
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) return;
  if(state.regionAuto) applyAutoRegion();
  const dayChanged = todayKey()!==lastDay; lastDay = todayKey();
  if(dayChanged || Date.now()-state.lastFetch > 10*60*1000){ loadData(); checkVersion(); } else render();
});
if(state.regionAuto || !REGIONS[state.region]) applyAutoRegion();
save();
applyStatic();
render();
loadData();
checkVersion();
</script>
</body>
</html>
